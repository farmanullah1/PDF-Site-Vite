<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Toolkit — Free online PDF tools</title>
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/home.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">PDF</span>
      <span class="brand-name">Toolkit</span>
    </div>
    <nav class="category-nav" aria-label="Tool categories"></nav>
  </header>

  <main>
    <section class="hero">
      <h1>Every PDF task, one place.</h1>
      <p>Merge, split, rotate, number, watermark, organize, and convert PDFs — right in your browser.</p>
    </section>

    <section class="filter-row" aria-label="Filter tools by category"></section>

    <section class="tool-grid" aria-label="PDF tools"></section>
  </main>

  <footer class="site-footer">
    <p>PDF Toolkit is a client-side demo for learning. It is not affiliated with any real PDF service and does not upload your files anywhere.</p>
    <p>© PDF Toolkit demo</p>
  </footer>

  <script type="module" src="js/tools.js"></script>
</body>
</html>
